# =====================================================================
# 🚀 ENTERPRISE MULTI-PROJECT CI/CD PIPELINE (GitLab CI)
# =====================================================================
# This pipeline orchestrates linting, testing, security scans, 
# Docker multi-stage builds, and GitOps deployment triggers.

stages:
  - lint-and-test
  - security-scan
  - build-images
  - deploy-gitops

# Cache configurations for Maven and NPM to speed up build runs
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - backend/.m2/repository/
    - frontend/node_modules/
    - ai-service/.venv/

# =====================================================================
# STAGE 1: LINT & TEST
# =====================================================================

# 1.1 Java Spring Boot Backend Checks
backend-test:
  stage: lint-and-test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn clean test -Dmaven.repo.local=.m2/repository
  artifacts:
    reports:
      junit: backend/target/surefire-reports/*.xml
    paths:
      - backend/target/

# 1.2 Python FastAPI AI Service Checks
ai-service-lint:
  stage: lint-and-test
  image: python:3.11-slim
  script:
    - cd ai-service
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install -r requirements.txt
    - pip install flake8 pytest
    - flake8 app/ --max-line-length=120
    - pytest
  allow_failure: true

# 1.3 React Frontend Checks
frontend-test:
  stage: lint-and-test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run test -- --watchAll=false --passWithNoTests

# =====================================================================
# STAGE 2: SAST & CODE QUALITY SCAN (SonarQube)
# =====================================================================

sonarqube-sast:
  stage: security-scan
  image: maven:3.9-eclipse-temurin-21
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  script:
    - cd backend
    - mvn verify sonar:sonar -Dsonar.projectKey=neuralconsult-backend -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN -Dmaven.repo.local=.m2/repository
  only:
    - main

# =====================================================================
# STAGE 3: BUILD & CONTAINER SECURITY SCAN (Docker + Trivy)
# =====================================================================

.build-template: &build_definition
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin $REGISTRY_URL
    - apk add --no-cache curl
    # Install Trivy for container image vulnerability scanning
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.48.3

build-backend-image:
  stage: build-images
  <<: *build_definition
  script:
    - docker build -t $REGISTRY_URL/neuralconsult-backend:$CI_COMMIT_SHORT_SHA -f docker/backend.Dockerfile .
    - trivy image --severity HIGH,CRITICAL --exit-code 0 $REGISTRY_URL/neuralconsult-backend:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_URL/neuralconsult-backend:$CI_COMMIT_SHORT_SHA
  only:
    - main

build-ai-service-image:
  stage: build-images
  <<: *build_definition
  script:
    - docker build -t $REGISTRY_URL/neuralconsult-ai:$CI_COMMIT_SHORT_SHA -f docker/ai-service.Dockerfile .
    - trivy image --severity HIGH,CRITICAL --exit-code 0 $REGISTRY_URL/neuralconsult-ai:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_URL/neuralconsult-ai:$CI_COMMIT_SHORT_SHA
  only:
    - main

build-frontend-image:
  stage: build-images
  <<: *build_definition
  script:
    - docker build -t $REGISTRY_URL/neuralconsult-frontend:$CI_COMMIT_SHORT_SHA -f docker/frontend.Dockerfile .
    - trivy image --severity HIGH,CRITICAL --exit-code 0 $REGISTRY_URL/neuralconsult-frontend:$CI_COMMIT_SHORT_SHA
    - docker push $REGISTRY_URL/neuralconsult-frontend:$CI_COMMIT_SHORT_SHA
  only:
    - main

# =====================================================================
# STAGE 4: GITOPS CONTINUOUS DELIVERY TRIGGER
# =====================================================================
# This job cloned the dedicated Kubernetes manifest repository, updates 
# the image tags in the deployment files, and pushes changes back.
# ArgoCD on the Kubernetes cluster automatically triggers the rolling update.

trigger-gitops-deploy:
  stage: deploy-gitops
  image: alpine/git:v2.43.0
  before_script:
    - git config --global user.email "devops-bot@neuralconsult.com"
    - git config --global user.name "NeuralConsult DevOps Bot"
  script:
    # Clone the private deployment repo containing Kubernetes/Helm manifests
    - git clone https://oauth2:$GITOPS_ACCESS_TOKEN@gitlab.com/neuralconsult/k8s-manifests.git
    - cd k8s-manifests
    # Update the tag inside the Helm values.yaml file using sed
    - sed -i "s/tag:.*/tag:\ \"$CI_COMMIT_SHORT_SHA\"/g" values.yaml
    - git add values.yaml
    - git commit -m "chore(deploy): release version $CI_COMMIT_SHORT_SHA [skip ci]"
    - git push origin main
  only:
    - main
