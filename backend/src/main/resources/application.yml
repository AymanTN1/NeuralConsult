spring:
  application:
    name: neuralconsult-sevrage
  datasource:
    url: jdbc:postgresql://localhost:5432/neuralconsult
    username: neural
    password: neuralpass
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

server:
  port: 8080

ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

security:
  jwt:
    secret: "change-me-super-secret-256-bit-key"
    issuer: "neuralconsult"
    accessTokenMinutes: 60
    refreshTokenDays: 14
    cookieSecure: false

app:
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    fromAddress: ${APP_MAIL_FROM_ADDRESS:no-reply@neuralconsult.local}
    fromName: ${APP_MAIL_FROM_NAME:NeuralConsult Sevrage}
    verificationCodeTtlMinutes: ${APP_MAIL_VERIFICATION_CODE_TTL_MINUTES:15}
    passwordResetCodeTtlMinutes: ${APP_MAIL_PASSWORD_RESET_CODE_TTL_MINUTES:15}
