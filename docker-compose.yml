services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: neuralconsult
      POSTGRES_USER: neural
      POSTGRES_PASSWORD: neuralpass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    image: aymantantani/neuralconsult-backend:latest
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/neuralconsult
      SPRING_DATASOURCE_USERNAME: neural
      SPRING_DATASOURCE_PASSWORD: neuralpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      AI_SERVICE_BASE_URL: http://ai-service:8000
    ports:
      - "8080:8080"
    depends_on:
      - db
      - ai-service

  frontend:
    image: aymantantani/neuralconsult-frontend:latest
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:80"

  ai-service:
    image: aymantantani/neuralconsult-ai-service:latest
    build:
      context: .
      dockerfile: docker/ai.Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      RAG_VECTOR_ENDPOINT: ${RAG_VECTOR_ENDPOINT:-}
    ports:
      - "8000:8000"

  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  db_data:
