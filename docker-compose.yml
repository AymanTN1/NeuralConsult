services:
  db:
    image: postgres:16-alpine
    container_name: neuralconsult-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neuralconsult}
      POSTGRES_USER: ${POSTGRES_USER:-neural}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuralpass}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neural} -d ${POSTGRES_DB:-neuralconsult}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    image: neuralconsult-ai-service:latest
    container_name: neuralconsult-ai-service
    build:
      context: .
      dockerfile: docker/ai.Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      RAG_VECTOR_ENDPOINT: ${RAG_VECTOR_ENDPOINT:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    image: neuralconsult-backend:latest
    container_name: neuralconsult-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/neuralconsult}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-neural}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-neuralpass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_FROM_ADDRESS: ${APP_MAIL_FROM_ADDRESS:-no-reply@neuralconsult.local}
      APP_MAIL_FROM_NAME: ${APP_MAIL_FROM_NAME:-NeuralConsult Sevrage}
      APP_MAIL_VERIFICATION_CODE_TTL_MINUTES: ${APP_MAIL_VERIFICATION_CODE_TTL_MINUTES:-15}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  frontend:
    image: neuralconsult-frontend:latest
    container_name: neuralconsult-frontend
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

  adminer:
    image: adminer:4
    container_name: neuralconsult-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  db_data:

