# =====================================================================
# 🐳 KUBERNETES MANIFESTS - PYTHON FASTAPI AI SERVICE
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service-deployment
  namespace: neuralconsult
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: docker.io/aymantantani/neuralconsult-ai:latest # Overwritten by ArgoCD
          ports:
            - containerPort: 8000
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: gemini-api-key
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: groq-api-key
          volumeMounts:
            - name: chroma-storage
              mountPath: /app/chroma_db
          resources:
            limits:
              cpu: "1000m"
              memory: "1536Mi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: chroma-storage
          persistentVolumeClaim:
            claimName: chroma-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service-service
  namespace: neuralconsult
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: ai-service
---
# Persistent Volume Claim for storing the ChromaDB vector database files permanently
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-pvc
  namespace: neuralconsult
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
